---
- name: Verify Azure ingestion and dashboard publication
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Verify the published business panels through Grafana
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../tools/validate_grafana.py"
          - --endpoint
          - "{{ zava_grafana_endpoint }}"
          - --query-endpoint
          - "{{ zava_prometheus_query_endpoint }}"
      changed_when: false

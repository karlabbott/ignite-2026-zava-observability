---
- name: Load prepared Azure metrics coordinates
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../generated/azure.yml"
  tags:
    - observability_prepare
    - observability_deploy

- name: Ensure Azure Managed Grafana CLI extension is available
  tags:
    - observability_prepare
  ansible.builtin.command:
    argv:
      - az
      - extension
      - add
      - --name
      - amg
      - --upgrade
      - --only-show-errors
  changed_when: false

- name: Resolve the current Azure operator
  tags:
    - observability_prepare
  ansible.builtin.command:
    argv:
      - az
      - ad
      - signed-in-user
      - show
      - --query
      - id
      - --output
      - tsv
      - --only-show-errors
  register: grafana_dashboard_operator
  changed_when: false

- name: Build Azure Managed Grafana resource ID
  tags:
    - observability_prepare
  ansible.builtin.set_fact:
    grafana_dashboard_resource_id: >-
      /subscriptions/{{ azure_subscription_id }}/resourceGroups/{{
      azure_resource_group }}/providers/Microsoft.Dashboard/grafana/{{
      azure_managed_grafana_name }}

- name: Check current operator Grafana access
  tags:
    - observability_prepare
  ansible.builtin.command:
    argv:
      - az
      - role
      - assignment
      - list
      - --assignee
      - "{{ grafana_dashboard_operator.stdout | trim }}"
      - --role
      - Grafana Admin
      - --scope
      - "{{ grafana_dashboard_resource_id }}"
      - --query
      - length(@)
      - --output
      - tsv
      - --only-show-errors
  register: grafana_dashboard_operator_assignments
  changed_when: false

- name: Grant current operator Grafana dashboard access
  tags:
    - observability_prepare
  ansible.builtin.command:
    argv:
      - az
      - role
      - assignment
      - create
      - --assignee-object-id
      - "{{ grafana_dashboard_operator.stdout | trim }}"
      - --assignee-principal-type
      - User
      - --role
      - Grafana Admin
      - --scope
      - "{{ grafana_dashboard_resource_id }}"
      - --only-show-errors
      - --output
      - none
  when: grafana_dashboard_operator_assignments.stdout | trim == '0'
  changed_when: true

- name: Wait for current operator Grafana access before the talk
  ansible.builtin.command:
    argv:
      - az
      - grafana
      - dashboard
      - list
      - --resource-group
      - "{{ azure_resource_group }}"
      - --name
      - "{{ azure_managed_grafana_name }}"
      - --query
      - length(@)
      - --output
      - tsv
      - --only-show-errors
  register: grafana_dashboard_access
  retries: 20
  delay: 15
  until: grafana_dashboard_access.rc == 0
  changed_when: false
  tags:
    - observability_prepare

- name: Require the prepared Grafana CLI extension
  ansible.builtin.command:
    argv:
      - az
      - extension
      - show
      - --name
      - amg
      - --output
      - none
      - --only-show-errors
  changed_when: false
  when: zava_observability_phase | default('full') == 'stage'
  tags:
    - observability_deploy

- name: Check the real business query path before the talk
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/../tools/validate_grafana.py"
      - --endpoint
      - "{{ zava_grafana_endpoint }}"
      - --query-endpoint
      - "{{ zava_prometheus_query_endpoint }}"
      - --prepare
  changed_when: false
  tags:
    - observability_prepare

- name: Bind the dashboard to the prepared metrics workspace
  tags:
    - observability_deploy
  block:
    - name: Read available Grafana datasources
      ansible.builtin.command:
        argv:
          - az
          - grafana
          - data-source
          - list
          - --resource-group
          - "{{ azure_resource_group }}"
          - --name
          - "{{ azure_managed_grafana_name }}"
          - --only-show-errors
          - --output
          - json
      register: grafana_dashboard_datasources
      changed_when: false

    - name: Select the configured Azure metrics datasource
      ansible.builtin.set_fact:
        grafana_dashboard_matching_sources: >-
          {{ (grafana_dashboard_datasources.stdout | from_json)
             | selectattr('type', 'equalto', 'prometheus')
             | selectattr('url', 'equalto', zava_prometheus_query_endpoint | regex_replace('/$', ''))
             | list }}
        grafana_dashboard_definition: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../dashboards/zava-shipment-flow.json') | from_json }}

    - name: Require exactly one configured Azure metrics datasource
      ansible.builtin.assert:
        that:
          - grafana_dashboard_matching_sources | length == 1
        fail_msg: The prepared workspace must have exactly one Prometheus datasource in Grafana.

    - name: Render the dashboard with an explicit workspace selection
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../generated/zava-shipment-flow.json"
        mode: "0644"
        content: >-
          {{ grafana_dashboard_definition | combine({
            'dashboard': {
              'templating': {
                'list': [
                  grafana_dashboard_definition.dashboard.templating.list[0] | combine({
                    'current': {
                      'text': grafana_dashboard_matching_sources[0].name,
                      'value': grafana_dashboard_matching_sources[0].uid
                    },
                    'regex': '^' ~ (grafana_dashboard_matching_sources[0].name | regex_escape) ~ '$'
                  })
                ]
              }
            }
          }, recursive=true) | to_nice_json }}

- name: Publish Zava operations dashboard
  tags:
    - observability_deploy
  ansible.builtin.command:
    argv:
      - az
      - grafana
      - dashboard
      - create
      - --resource-group
      - "{{ azure_resource_group }}"
      - --name
      - "{{ azure_managed_grafana_name }}"
      - --title
      - Zava Shipment Flow
      - --definition
      - "@{{ playbook_dir }}/../generated/zava-shipment-flow.json"
      - --overwrite
      - "true"
      - --only-show-errors
      - --output
      - none
  register: grafana_dashboard_publish
  retries: 20
  delay: 15
  until: grafana_dashboard_publish.rc == 0
  changed_when: true

---
- name: Resolve Prometheus architecture
  ansible.builtin.set_fact:
    prometheus_collector_arch: "{{ prometheus_collector_arch_map.get(ansible_architecture, '') }}"

- name: Validate Prometheus configuration inputs
  ansible.builtin.assert:
    that:
      - prometheus_collector_arch | length > 0
      - zava_prometheus_remote_write_url is defined
      - zava_prometheus_remote_write_url | length > 40
    fail_msg: >-
      Prometheus requires a supported architecture and the managed-identity
      remote-write URL produced by the Azure control-plane play.

- name: Create Prometheus service account
  ansible.builtin.user:
    name: "{{ prometheus_collector_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/prometheus, owner: root, group: prometheus, mode: "0750" }
    - { path: /etc/prometheus/rules, owner: root, group: prometheus, mode: "0750" }
    - { path: "{{ prometheus_collector_root }}", owner: root, group: prometheus, mode: "0750" }
    - { path: "{{ prometheus_collector_data_dir }}", owner: prometheus, group: prometheus, mode: "0750" }

- name: Download Prometheus
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{
      prometheus_version }}.linux-{{ prometheus_collector_arch }}.tar.gz
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"
    checksum: "sha256:{{ prometheus_collector_checksums[prometheus_collector_arch] }}"

- name: Extract Prometheus
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_collector_arch }}/prometheus"

- name: Install Prometheus binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_collector_arch }}/{{ item }}"
    dest: "{{ prometheus_collector_root }}/{{ item }}"
    owner: root
    group: prometheus
    mode: "0750"
    remote_src: true
  loop:
    - prometheus
    - promtool
  notify: Restart Prometheus

- name: Install Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: prometheus
    mode: "0640"
    validate: "{{ prometheus_collector_root }}/promtool check config %s"
  notify: Restart Prometheus

- name: Install Zava recording and alert rules
  ansible.builtin.template:
    src: zava-rules.yml.j2
    dest: /etc/prometheus/rules/zava-rules.yml
    owner: root
    group: prometheus
    mode: "0640"
    validate: "{{ prometheus_collector_root }}/promtool check rules %s"
  notify: Restart Prometheus

- name: Install Prometheus service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Prometheus

- name: Enable Prometheus
  ansible.builtin.systemd_service:
    name: prometheus.service
    enabled: true
    state: started
    daemon_reload: true
